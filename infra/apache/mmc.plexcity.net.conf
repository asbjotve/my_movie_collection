<VirtualHost *:8085>
    ServerName mmc.plexcity.net
    ServerAlias www.mmc.plexcity.net
    ServerAdmin asbjorn.tveit@tveitas.net
    DocumentRoot /var/www/mmc.plexcity.net/public
    ErrorLog ${APACHE_LOG_DIR}/mmc_error.log
    CustomLog ${APACHE_LOG_DIR}/mmc_access.log combined

    # Basic security response headers (see TODO.md "Basic security
    # response headers") - applies to every tool/version under this
    # vhost, old and new, with a single change here.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://tmdb.media.plexcity.net https://*.thetvdb.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

    <Directory /var/www/mmc.plexcity.net/public/ci_hva_du>
        AllowOverride All
    </Directory>

    <Directory /var/www/mmc.plexcity.net/public/add_movie_movie>
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
    </Directory>

    <Directory /var/www/mmc.plexcity.net/public/add_to_wishlist>
        php_value upload_max_filesize 30M
        php_value post_max_size 32M
    </Directory>
</VirtualHost>
