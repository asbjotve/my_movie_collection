<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media-katalog v12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">v12</p>
        <h1>TMDB-lignende detaljside med egen samlingsfane</h1>
        <p class="intro">Hovedsiden viser filmen som en ren detaljside, mens egne eksemplarer og digitale utgaver ligger i en separat fane.</p>
      </div>

      <div class="search-shell">
        <label class="search-box" for="searchInput">
          <span class="search-label">Søk</span>
          <input id="searchInput" type="search" placeholder="Søk etter tittel, originaltittel eller ekstern ID">
        </label>
      </div>
    </header>

    <section id="searchPanel" class="search-panel is-hidden"></section>

    <section id="heroSection"></section>

    <nav id="tabBar" class="tab-bar"></nav>

    <section class="content-layout">
      <div id="mainContent" class="main-content"></div>
      <aside id="sideContent" class="side-content"></aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
