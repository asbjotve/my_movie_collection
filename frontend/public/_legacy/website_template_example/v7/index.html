<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media-katalog v7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <p class="eyebrow">v7</p>
        <h1>Plakatvegg + overlay</h1>
      </div>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Søk">
        <select id="typeFilter">
          <option value="">Alle typer</option>
          <option value="movie">Film</option>
          <option value="series">Serie</option>
          <option value="concert">Konsert</option>
        </select>
      </div>
    </header>

    <section id="heroSection"></section>
    <section id="posterWall" class="poster-wall"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
