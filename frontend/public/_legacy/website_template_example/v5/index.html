<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media-katalog v5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">v5</p>
        <h1>Katalog med tabellfokus</h1>
      </div>
      <div class="tools">
        <input id="searchInput" type="search" placeholder="Søk i katalogen">
        <select id="typeFilter">
          <option value="">Alle typer</option>
          <option value="movie">Film</option>
          <option value="series">Serie</option>
          <option value="concert">Konsert</option>
        </select>
      </div>
    </header>

    <section class="layout">
      <div class="panel">
        <div class="table-head">
          <h2>Innhold</h2>
          <div class="muted">Treff: <strong id="resultCount">0</strong></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tittel</th>
                <th>Type</th>
                <th>Release</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <section id="detailPanel"></section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
