<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media-katalog v3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar panel">
      <p class="eyebrow">v3</p>
      <h1>Bibliotek</h1>
      <input id="searchInput" type="search" placeholder="Søk i samlingen">
      <select id="typeFilter">
        <option value="">Alle typer</option>
        <option value="movie">Film</option>
        <option value="series">Serie</option>
        <option value="concert">Konsert</option>
      </select>
      <label class="watch-filter">
        <input id="watchedFilter" type="checkbox">
        <span>Bare usette</span>
      </label>
      <div class="muted small">Treff: <strong id="resultCount">0</strong></div>
      <div id="listPanel" class="list-panel"></div>
    </aside>

    <section id="detailPanel" class="detail-panel"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
